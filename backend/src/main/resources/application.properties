# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/saptashrungi_db
spring.datasource.username=postgres
spring.datasource.password=tiger
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.templeapp=DEBUG

# Application Name
spring.application.name=saptashrungi-temple-backend

# JWT Configuration
jwt.secret=your_jwt_secret_key_here_min_256_bits_length_for_security
jwt.expiration=86400000

# Razorpay Configuration
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
